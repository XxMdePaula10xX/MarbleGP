# Pipeline Codemagic do Marble GP.
#
# "capacitor-ios" — app web (web/, TypeScript + Canvas) empacotado com
# Capacitor e enviado ao TestFlight. Requisitos no Codemagic:
#   1) Integração App Store Connect "quantum_asc" (já existente na conta;
#      chave 4UQMCZZJ95). Se usar outra, troque o nome em app_store_connect.
#   2) O app com bundle id com.matheuscastro.marblegp precisa existir no
#      App Store Connect (My Apps > + > New App) antes do 1º envio.
#
# (O workflow legado do Unity foi removido — a migração para web está completa.
#  Referência do build Unity fica no histórico do Git, se necessário.)
workflows:
  capacitor-ios:
    name: Marble GP - iOS TestFlight (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: quantum_asc   # integração existente no Codemagic (chave 4UQMCZZJ95)
    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.matheuscastro.marblegp
        XCODE_WORKSPACE: web/ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Instalar dependências
        script: |
          cd web && npm ci
      - name: Build web (tsc + vite)
        script: |
          cd web && npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          cd web && npx cap sync ios
      - name: Número de build (TestFlight exige crescente)
        script: |
          cd web/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Assinatura (reusa .p12 salvo, ou cria no 1º build)
        script: |
          set -e
          keychain initialize
          CERT_PW="${IOS_DIST_CERT_PASSWORD:-marblegp}"
          CERT_KEY=/tmp/marblegp_cert_key.pem

          if [ -n "$IOS_DIST_CERT_B64" ]; then
            # ---- Modo REUSO: usa o certificado salvo em variável segura ----
            # (nenhum certificado é criado — some o limite da Apple).
            echo "== reusando certificado salvo (IOS_DIST_CERT_B64) =="
            echo "$IOS_DIST_CERT_B64" | base64 --decode > /tmp/marblegp_dist.p12
            # Extrai a chave privada do .p12 para casar com o cert já existente.
            openssl pkcs12 -in /tmp/marblegp_dist.p12 -nocerts -nodes \
              -passin pass:"$CERT_PW" -out "$CERT_KEY"
          else
            # ---- Modo BOOTSTRAP (1º build): cria o certificado e exporta ----
            # o .p12 como artefato. GUARDE-O: ver instruções no fim do build.
            # Requer um slot livre de certificado de distribuição na conta
            # Apple (revogue os órfãos em developer.apple.com se der 409).
            echo "== BOOTSTRAP: criando certificado de distribuição =="
            openssl genrsa -out "$CERT_KEY" 2048
            app-store-connect certificates create \
              --type IOS_DISTRIBUTION \
              --certificate-key @file:"$CERT_KEY" \
              --p12-password "$CERT_PW" \
              --save
            cp "$HOME/Library/Developer/Xcode/UserData/Certificates/"*.p12 \
              "$CM_BUILD_DIR/marblegp_dist.p12"
            base64 "$CM_BUILD_DIR/marblegp_dist.p12" \
              > "$CM_BUILD_DIR/marblegp_dist.p12.b64.txt"
            echo ">>> GUARDE o artefato marblegp_dist.p12.b64.txt: salve o"
            echo ">>> conteúdo como variável segura IOS_DIST_CERT_B64 e a senha"
            echo ">>> IOS_DIST_CERT_PASSWORD='$CERT_PW' no Codemagic. A partir"
            echo ">>> daí os builds reusam o certificado (sem criar de novo)."
          fi

          # Provisioning profile (sem limite): cria/baixa e casa com a chave
          # privada acima. Em modo reuso, isso baixa o cert existente (não cria).
          echo "== fetch-signing-files =="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$CERT_KEY" \
            --create

          echo "== add-certificates =="
          keychain add-certificates

          echo "== use-profiles =="
          xcode-project use-profiles
      - name: Gerar IPA assinado
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - marblegp_dist.p12          # só no bootstrap: guarde e depois apague
      - marblegp_dist.p12.b64.txt  # conteúdo → variável segura IOS_DIST_CERT_B64
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
