# Pipeline Codemagic do Marble GP.
#
# "capacitor-ios" — app web (web/, TypeScript + Canvas) empacotado com
# Capacitor e enviado ao TestFlight. Requisitos no Codemagic:
#   1) Integração App Store Connect "quantum_asc" (já existente na conta;
#      chave 4UQMCZZJ95). Se usar outra, troque o nome em app_store_connect.
#   2) O app com bundle id com.matheuscastro.marblegp precisa existir no
#      App Store Connect (My Apps > + > New App) antes do 1º envio.
#
# (O workflow legado do Unity foi removido — a migração para web está completa.
#  Referência do build Unity fica no histórico do Git, se necessário.)
workflows:
  capacitor-ios:
    name: Marble GP - iOS TestFlight (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: quantum_asc   # integração existente no Codemagic (chave 4UQMCZZJ95)
    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.matheuscastro.marblegp
        XCODE_WORKSPACE: web/ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Instalar dependências
        script: |
          cd web && npm ci
      - name: Build web (tsc + vite)
        script: |
          cd web && npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          cd web && npx cap sync ios
      - name: Número de build (TestFlight exige crescente)
        script: |
          cd web/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Assinatura (cria certificado + perfil se faltarem)
        script: |
          set -e
          keychain initialize

          # 1) Garante um certificado de distribuição na conta e salva a
          #    chave privada localmente (necessária para assinar). Se já
          #    existir um certificado utilizável, reaproveita.
          echo "== create-certificate =="
          app-store-connect create-certificate \
            --type IOS_DISTRIBUTION \
            --save || echo "(certificado já existe — seguindo)"

          # 2) Cria/baixa o provisioning profile App Store para o bundle id.
          echo "== fetch-signing-files =="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # 3) Instala os certificados salvos no keychain do build.
          echo "== add-certificates =="
          keychain add-certificates

          # 4) Aplica os profiles ao projeto Xcode. Falha explicitamente se
          #    nenhum profile foi aplicado (evita erro obscuro no archive).
          echo "== use-profiles =="
          xcode-project use-profiles
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          if ! ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision >/dev/null 2>&1; then
            echo "ERRO: nenhum provisioning profile foi criado/baixado." >&2
            echo "Verifique se a API key da integração tem papel App Manager/Admin." >&2
            exit 1
          fi
      - name: Gerar IPA assinado
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
