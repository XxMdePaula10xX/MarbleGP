# Pipelines Codemagic do Marble GP.
#
# PRINCIPAL: "capacitor-ios" — app web (web/, TypeScript + Canvas) empacotado
# com Capacitor e enviado ao TestFlight. Requisitos no Codemagic:
#   1) Integração App Store Connect "quantum_asc" (já existente na conta;
#      chave 4UQMCZZJ95). Se usar outra, troque o nome em app_store_connect.
#   2) Nada de Unity: não precisa de licença nem variáveis extras.
#
# LEGADO: "unity-ios" — build do projeto Unity original (mantido para
# referência durante a transição; requer grupo "unity_credentials").
workflows:
  capacitor-ios:
    name: Marble GP - iOS TestFlight (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: quantum_asc   # integração existente no Codemagic (chave 4UQMCZZJ95)
    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.matheuscastro.marblegp
      vars:
        XCODE_WORKSPACE: web/ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Instalar dependências
        script: |
          cd web && npm ci
      - name: Build web (tsc + vite)
        script: |
          cd web && npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          cd web && npx cap sync ios
      - name: Número de build (TestFlight exige crescente)
        script: |
          cd web/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Perfis de assinatura
        script: xcode-project use-profiles
      - name: Gerar IPA assinado
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ---- LEGADO (Unity). Será removido quando a migração for concluída. ----
  unity-ios:
    name: (legado) Marble GP Unity - iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - unity_credentials            # UNITY_EMAIL / UNITY_PASSWORD / UNITY_SERIAL
      integrations:
        app_store_connect: quantum_asc
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.matheuscastro.marblegp
      vars:
        UNITY_HOME: /Applications/Unity/Hub/Editor/2022.3.40f1/Unity.app
        UNITY_BIN: $UNITY_HOME/Contents/MacOS/Unity
        XCODE_PROJECT: ios/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
    scripts:
      - name: Ativar licenca do Unity
        script: |
          $UNITY_BIN -batchmode -quit -nographics -logFile \
            -serial ${UNITY_SERIAL} -username ${UNITY_EMAIL} -password ${UNITY_PASSWORD}
      - name: Unity -> projeto Xcode
        script: |
          $UNITY_BIN -batchmode -quit -nographics -logFile \
            -projectPath . \
            -executeMethod MarbleGP.EditorTools.CIBuild.BuildIOS
      - name: Perfis de assinatura
        script: xcode-project use-profiles
      - name: Gerar IPA assinado
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      scripts:
        - name: Devolver licenca do Unity
          script: $UNITY_BIN -batchmode -quit -nographics -logFile -returnlicense || true
