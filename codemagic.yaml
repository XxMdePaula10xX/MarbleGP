# Pipeline Codemagic do Marble GP.
#
# "capacitor-ios" — app web (web/, TypeScript + Canvas) empacotado com
# Capacitor e enviado ao TestFlight. Requisitos no Codemagic:
#   1) Integração App Store Connect "quantum_asc" (já existente na conta;
#      chave 4UQMCZZJ95). Se usar outra, troque o nome em app_store_connect.
#   2) O app com bundle id com.matheuscastro.marblegp precisa existir no
#      App Store Connect (My Apps > + > New App) antes do 1º envio.
#
# (O workflow legado do Unity foi removido — a migração para web está completa.
#  Referência do build Unity fica no histórico do Git, se necessário.)
workflows:
  capacitor-ios:
    name: Marble GP - iOS TestFlight (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: quantum_asc   # integração existente no Codemagic (chave 4UQMCZZJ95)
    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.matheuscastro.marblegp
        XCODE_WORKSPACE: web/ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Instalar dependências
        script: |
          cd web && npm ci
      - name: Build web (tsc + vite)
        script: |
          cd web && npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          cd web && npx cap sync ios
      - name: Número de build (TestFlight exige crescente)
        script: |
          cd web/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Assinatura (gera certificado próprio + perfil)
        script: |
          set -e
          keychain initialize

          # A conta Apple já tem certificados de distribuição (Expo EAS),
          # mas o Codemagic não tem a chave privada deles. Geramos uma chave
          # nova e criamos um certificado de distribuição próprio para este
          # pipeline — assim temos a chave privada e conseguimos assinar.
          CERT_KEY=/tmp/marblegp_cert_key.pem
          echo "== gerar chave privada =="
          openssl genrsa -out "$CERT_KEY" 2048

          echo "== certificates create =="
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key @file:"$CERT_KEY" \
            --save

          # Cria/baixa o provisioning profile App Store e casa com o
          # certificado cuja chave privada acabamos de gerar.
          echo "== fetch-signing-files =="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$CERT_KEY" \
            --create

          echo "== add-certificates =="
          keychain add-certificates

          echo "== use-profiles =="
          xcode-project use-profiles
      - name: Gerar IPA assinado
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
