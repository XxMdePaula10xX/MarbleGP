# Pipeline Codemagic do Marble GP.
#
# "capacitor-ios" — app web (web/, TypeScript + Canvas) empacotado com
# Capacitor e enviado ao TestFlight. Requisitos no Codemagic:
#   1) Integração App Store Connect "quantum_asc" (já existente na conta;
#      chave 4UQMCZZJ95). Se usar outra, troque o nome em app_store_connect.
#   2) O app com bundle id com.matheuscastro.marblegp precisa existir no
#      App Store Connect (My Apps > + > New App) antes do 1º envio.
#
# (O workflow legado do Unity foi removido — a migração para web está completa.
#  Referência do build Unity fica no histórico do Git, se necessário.)
workflows:
  capacitor-ios:
    name: Marble GP - iOS TestFlight (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: quantum_asc   # integração existente no Codemagic (chave 4UQMCZZJ95)
    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.matheuscastro.marblegp
        XCODE_WORKSPACE: web/ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Instalar dependências
        script: |
          cd web && npm ci
      - name: Build web (tsc + vite)
        script: |
          cd web && npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          cd web && npx cap sync ios
      - name: Número de build (TestFlight exige crescente)
        script: |
          cd web/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Assinatura automática (limpa certs antigos e cria um novo)
        script: |
          set -e
          keychain initialize
          CERT_PW="${IOS_DIST_CERT_PASSWORD:-marblegp}"
          CERT_KEY=/tmp/marblegp_cert_key.pem

          if [ -n "$IOS_DIST_CERT_B64" ]; then
            # ---- Modo REUSO (opcional): certificado fixo em variável segura --
            # Se você definir IOS_DIST_CERT_B64, o pipeline reusa esse .p12 e
            # NÃO revoga nem cria nada. Útil se quiser um certificado estável.
            echo "== reusando certificado salvo (IOS_DIST_CERT_B64) =="
            echo "$IOS_DIST_CERT_B64" | base64 --decode > /tmp/marblegp_dist.p12
            openssl pkcs12 -in /tmp/marblegp_dist.p12 -nocerts -nodes \
              -passin pass:"$CERT_PW" -out "$CERT_KEY"
          else
            # ---- Modo AUTOMÁTICO (padrão) --------------------------------
            # Um certificado de distribuição não é reutilizável sem a chave
            # privada, que é efêmera no runner. Para não esbarrar no limite
            # da Apple, revogamos os certificados de distribuição existentes
            # e criamos um novo a cada build. Sem passos manuais.
            echo "== revogando certificados de distribuição antigos =="
            app-store-connect certificates list --type IOS_DISTRIBUTION --json \
              > /tmp/certs.json 2>/dev/null || echo "[]" > /tmp/certs.json
            python3 - <<'PY'
          import json, subprocess
          try:
              certs = json.load(open('/tmp/certs.json'))
          except Exception:
              certs = []
          for c in certs:
              cid = c.get('id')
              if not cid:
                  continue
              print('  revogando', cid, flush=True)
              # 'y' no stdin cobre uma eventual confirmação; ignorado se não houver.
              try:
                  subprocess.run(['app-store-connect', 'certificates', 'delete', cid],
                                 input=b'y\n', check=False)
              except Exception as e:
                  print('  (falha ao revogar, seguindo):', e, flush=True)
          PY
            echo "== criando certificado de distribuição novo =="
            openssl genrsa -out "$CERT_KEY" 2048
            app-store-connect certificates create \
              --type IOS_DISTRIBUTION \
              --certificate-key @file:"$CERT_KEY" \
              --p12-password "$CERT_PW" \
              --save
          fi

          # Provisioning profile: cria um novo contendo o certificado atual.
          echo "== fetch-signing-files =="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$CERT_KEY" \
            --create

          echo "== add-certificates =="
          keychain add-certificates

          echo "== use-profiles =="
          xcode-project use-profiles
      - name: Gerar IPA assinado
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
